services:

  postgres:
    image: postgres:17.11-alpine
    container_name: agencia-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: agencia
      POSTGRES_USER: agencia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agencia -d agencia"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - agencia-network


  redis:
    image: redis:7.4.11-alpine
    container_name: agencia-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - agencia-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: agencia-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8000

      DATABASE_URL: postgresql://agencia:${POSTGRES_PASSWORD}@postgres:5432/agencia
      REDIS_URL: redis://redis:6379

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}

      # Agentes v1.1 — LLM Interpreter + Shadow Mode. Desligado por
      # default (AGENT_LLM_ENABLED=false) — nada aqui é obrigatório para
      # o sistema funcionar. Nunca versionar AGENT_LLM_API_KEY/
      # OPENAI_API_KEY: só existem se definidas no .env local (gitignored).
      # AGENT_LLM_PROVIDER=gemini usa AGENT_LLM_API_KEY;
      # AGENT_LLM_PROVIDER=openai usa OPENAI_API_KEY — cada provider lê só
      # a sua (factory.ts).
      AGENT_LLM_ENABLED: ${AGENT_LLM_ENABLED:-false}
      AGENT_LLM_SHADOW_MODE: ${AGENT_LLM_SHADOW_MODE:-true}
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-gemini}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-gemini-2.0-flash}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_LLM_TIMEOUT_MS: ${AGENT_LLM_TIMEOUT_MS:-5000}
      AGENT_LLM_MIN_CONFIDENCE: ${AGENT_LLM_MIN_CONFIDENCE:-0.80}
      AGENT_LLM_CONTEXT_MESSAGES: ${AGENT_LLM_CONTEXT_MESSAGES:-10}

    ports:
      - "127.0.0.1:8300:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - agencia-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}

    container_name: agencia-frontend
    restart: unless-stopped

    environment:
      # Ver frontend/lib/auth/session.ts: "false" enquanto o acesso for
      # HTTP puro (sem Nginx/TLS na frente — docs/INFRASTRUCTURE.md §33/34).
      # Setar de volta para "true" (ou remover, esse é o padrão) assim que
      # houver HTTPS — cookie sem Secure não deve trafegar em produção real.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}

    ports:
      - "0.0.0.0:3300:3000"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - agencia-network


  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    # Dockerfile.dev tem CMD ["npm", "run", "dev"] (sobe o servidor com
    # hot-reload) porque essa imagem é reaproveitada pelo serviço `backend`
    # em desenvolvimento. Aqui, sem um `command` explícito, "docker compose
    # run --rm migrate" (sem argumento) subiria o servidor à toa em vez de
    # rodar qualquer migration. `db:migrate` é o comando padrão mais seguro
    # — sempre sobrescrevível para as demais tarefas do container `tools`
    # (db:seed, typecheck, build, test — ver README.md seções 5/6).
    command: ["npm", "run", "db:migrate"]

    container_name: agencia-migrate

    environment:
      NODE_ENV: development

      DATABASE_URL: postgresql://agencia:${POSTGRES_PASSWORD}@postgres:5432/agencia
      REDIS_URL: redis://redis:6379

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}

      CEO_NAME: ${CEO_NAME}
      CEO_EMAIL: ${CEO_EMAIL}
      CEO_PASSWORD: ${CEO_PASSWORD}

      AGENT_LLM_ENABLED: ${AGENT_LLM_ENABLED:-false}
      AGENT_LLM_SHADOW_MODE: ${AGENT_LLM_SHADOW_MODE:-true}
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-gemini}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-gemini-2.0-flash}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_LLM_TIMEOUT_MS: ${AGENT_LLM_TIMEOUT_MS:-5000}
      AGENT_LLM_MIN_CONFIDENCE: ${AGENT_LLM_MIN_CONFIDENCE:-0.80}
      AGENT_LLM_CONTEXT_MESSAGES: ${AGENT_LLM_CONTEXT_MESSAGES:-10}

    volumes:
      - ./backend:/app
      - /app/node_modules

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - agencia-network

    profiles:
      - tools


  n8n:
    image: n8nio/n8n:2.36.8
    container_name: agencia-n8n
    restart: unless-stopped

    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http

      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: agencia
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: "300"

    ports:
      - "127.0.0.1:5679:5678"

    volumes:
      - n8n_data:/home/node/.n8n

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - agencia-network


volumes:
  postgres_data:
  redis_data:
  n8n_data:


networks:
  agencia-network:
    driver: bridge